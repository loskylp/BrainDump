# docker-compose.staging.yml
#
# Staging environment for BrainDump on nxlabs.cc.
# Location on server: /opt/braindump/docker-compose.staging.yml
# Per ADR-007: https://github.com/loskylp/BrainDump/blob/main/process/architect/adr/ADR-007-deployment-model.md
#
# First-time setup:
#   1. ssh deploy@nxlabs.cc /opt/postgres/provision.sh braindump-staging
#   2. Create /opt/braindump/.env.staging with the credentials from step 1 (see .env.example for variable names)
#   3. docker compose -f docker-compose.staging.yml pull
#   4. docker compose -f docker-compose.staging.yml up -d
#
# Subsequent deploys are handled automatically by Watchtower (polls every 5 min).
# CI pushes ghcr.io/loskylp/braindump:staging on every green build to main.
#
# Required .env.staging variables on the server:
#   POSTGRES_URL=postgresql://braindump_staging:<password>@postgres:5432/braindump_staging
#   SESSION_SECRET=<long random string, different from production>
#   NODE_ENV=staging
#   APP_URL=https://braindump.staging.nxlabs.cc
#   EMAIL_PROVIDER=console
#   EMAIL_FROM=noreply@staging.nxlabs.cc

services:
  braindump-staging:
    image: ghcr.io/loskylp/braindump:staging
    restart: unless-stopped
    env_file:
      - .env.staging
    labels:
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.braindump-staging.rule=Host(`braindump.staging.nxlabs.cc`)"
      - "traefik.http.routers.braindump-staging.tls.certresolver=letsencrypt"
      - "traefik.http.routers.braindump-staging.entrypoints=websecure"
      - "traefik.http.services.braindump-staging.loadbalancer.server.port=3000"
      # Watchtower auto-update (picks up new :staging tags)
      - "com.centurylinklabs.watchtower.enable=true"
      # Uptime Kuma monitoring via AutoKuma (auto-registers health check)
      - "kuma.braindump-staging.http.name=BrainDump Staging"
      - "kuma.braindump-staging.http.url=https://braindump.staging.nxlabs.cc/api/health"
    networks:
      - traefik
      - postgres

networks:
  traefik:
    external: true
  postgres:
    external: true
