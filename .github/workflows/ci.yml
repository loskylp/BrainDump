name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs on the same ref so pushed fixes don't queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ORG/braindump

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint backend
        run: npm run lint
        working-directory: backend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

  # ─────────────────────────────────────────────
  # Job 2: Unit tests (no database required)
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run backend unit tests
        run: npm run test:unit
        working-directory: backend
        env:
          NODE_ENV: test

      - name: Run frontend unit tests
        run: npm run test
        working-directory: frontend
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────
  # Job 3: Integration tests (requires PostgreSQL)
  # ─────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: braindump_test
          POSTGRES_PASSWORD: braindump_test
          POSTGRES_DB: braindump_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U braindump_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run integration tests
        run: npm run test:integration
        working-directory: backend
        env:
          NODE_ENV: test
          POSTGRES_URL: postgresql://braindump_test:braindump_test@localhost:5432/braindump_test
          SESSION_SECRET: ci-integration-test-secret-not-for-production
          APP_URL: http://localhost:3000
          EMAIL_PROVIDER: console

  # ─────────────────────────────────────────────
  # Job 4: Migration test
  # Apply all migrations to a fresh DB, then run the full test suite.
  # This satisfies FF-D11.
  # ─────────────────────────────────────────────
  migration-test:
    name: Migration Test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: braindump_migrate
          POSTGRES_PASSWORD: braindump_migrate
          POSTGRES_DB: braindump_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U braindump_migrate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run migrations against fresh database
        run: npx sequelize-cli db:migrate
        working-directory: backend
        env:
          NODE_ENV: test
          POSTGRES_URL: postgresql://braindump_migrate:braindump_migrate@localhost:5432/braindump_migrate

      - name: Run full test suite after migrations
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          POSTGRES_URL: postgresql://braindump_migrate:braindump_migrate@localhost:5432/braindump_migrate
          SESSION_SECRET: ci-migration-test-secret-not-for-production
          APP_URL: http://localhost:3000
          EMAIL_PROVIDER: console

  # ─────────────────────────────────────────────
  # Job 5: Build Docker image
  # Runs after all test jobs pass.
  # On push to main: also pushes :staging tag to ghcr.io (FF-D32, FF-D33).
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    needs: [lint, unit-tests, integration-tests, migration-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Only log in when we intend to push (main branch pushes only).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # On push to main, tag as :staging.
          # On PRs, no push -- build only (cache-from verifies the image builds).
          tags: |
            type=raw,value=staging,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          # Push only on push to main; PR builds validate the image without pushing.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache kept in the registry (only valid when logged in, i.e. main branch).
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE_NAME) || '' }}
          # Build args are not secrets -- they configure the build stage only.
          build-args: |
            NODE_ENV=production
